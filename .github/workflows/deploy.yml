# Unit-test, build and publish dist/ (portal.js + install page) to GitHub Pages on every push to
# main. End-to-end tests run in a separate job that does not block the deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for https://<owner>.github.io/<repo>/
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          PORTAL_BASE_URL="https://${owner}.github.io/${repo}/" \
          TONER_DATA_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/toner-data/toner.json" \
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Runs alongside the build and does not hold up deploying: a failure marks the commit
  # (and its annotations say why) but the site still goes live. E2E also runs locally before pushing.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: End-to-end tests against the mock printer
        run: |
          npx playwright install --with-deps chromium
          PW_CHANNEL="" npx playwright test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
