function doChk(n) {
var form = document.L;
var ofst=0;
var num;
for (var i = 0; i < form.length; i++) {
if (form.elements[i].type == "checkbox") {
ofst = i;
break;
}
}
chks[n]=1-chks[n];
if (chks[n]) {
//  if (doc.length>=dMax) {
//   chks[doc[0]]=0; document.L.elements[doc[0]+ofst].checked=false; doc=doc.slice(1,dMax);
//  }
doc[doc.length]=n;
retriveDsbl(n, doc.length);
}
else {
document.L.elements[n+ofst].checked=false;
if (doc[0]==n) doc=doc.slice(1,doc.length);
else if (doc[doc.length-1]==n) doc=doc.slice(0,doc.length-1);
else for (var i=1; i<doc.length-1; i++) if (doc[i]==n) {doc=doc.slice(0,i).concat(doc.slice(i+1,doc.length)); break;}
if (doc.length) retriveDsbl(doc[0], doc.length);
else {doChkRetrive();}
}
}
