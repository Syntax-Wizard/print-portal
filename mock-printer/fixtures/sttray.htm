var infoOut=[['センタートレイ',0]];
var priomenu = ['自動トレイ切り替え対象外','1番目','2番目','3番目','4番目','5番目','6番目','7番目','8番目'];
function wrTr() {document.write('<TR>');}
function wrTre() {document.writeln('</TR>');}
function wrHr(n) {document.writeln('<TR><TD colspan="', n, '"><HR size="2"></TD></TR>');}

}
function endTbl() {document.writeln('</TABLE></TD></TR></TABLE><P>');}
function wrTh(s) {
document.write('<TR><TH nowrap align="left" width="50%"><SMALL>', s);
if(s.length) document.write(colon);
document.write('</SMALL></TH>');
}
function wrThN(s) {
document.write('<TR><TH nowrap align="left"><SMALL>', s);
if (s.length) document.write(colon);
document.write('</SMALL></TH>');
}
function wrThW(s, w) {

}
function wrThNTRW(s, w) {

function wrSt2() {

wrTHd(lTbl[1]);
endTblItem();
bgnTblCntnt();
for (var i=0; i<hdrOut.length; i++) document.writeln('<TD nowrap width="50%">', hdrOut[i].small().bold(), '</TD>');  wrTre();
wrTr(); document.writeln('<TD colspan="', hdrOut.length, '"><HR size="2"></TD>'); wrTre();

wrTdS(infoOut[i][0]); wrTd(stsOut[infoOut[i][1]]); wrBr()
}

}
function wrDt(s) {document.write('<TD><SMALL>', s, '</SMALL></TD>');}
function wrQt(s, a) {

else {document.write(s);}
document.write('.png" width="24" height="21" align="middle" alt=""><SMALL>');

document.write('</SMALL></TD>');
}
function wrRow(r) {
wrTr();
wrDt(r[0]); 
wrDt(stsIn[r[1]]);
if(r[2] == '-') {wrDt('-');}
else {wrQt(r[2], r[7]);}
for (var i=3; i<6; i++) wrDt(r[i]);
if(r[i] != '-'){
var prio=0;
for (var j=0; j<infoIn.length; j++) {
if (infoIn[j][6] != '-') prio++;
}
if (r[i] == 9) {
wrDt(priomenu[prio]);
} else {
wrDt(priomenu[r[i]]);
}
}
else{
wrDt(r[i]);
}
wrTre(); wrBr();
}
function wrTray() {

wrTHd(lTbl[0]);
endTblItem();
bgnTblCntnt();
for (var i=0; i<hdrIn.length; i++) document.writeln('<TD nowrap>', hdrIn[i].small().bold(), '</TD>'); wrTre();

}

}
