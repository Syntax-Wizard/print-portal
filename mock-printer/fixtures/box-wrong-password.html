<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN">
<HTML>
<HEAD>
<TITLE>REQUEST: ERROR</TITLE>
<META http-equiv="Content-Type" content="text/html; charset=UTF-8">
<SCRIPT language="JavaScript1.2"><!--
var lBk='戻る';
var i = -1;
function wrBtn() {
document.writeln('<P align="center"><SMALL><INPUT type="button" value="', lBk, '" onClick="doback();"></SMALL></P>');
}
function wrHidden() {
if(parent != self) {
var splitcgi;
var splithtml2;
if (top.saved_params) {
var splithtml = top.saved_params.source_html.split("/");
for (i = 0; i <= top.cgiArray; i++) {
if (top.saved_cgi_params[i] == null || i == top.cgiArray) {
i=-1;
return;
}
splitcgi = top.saved_cgi_params[i].cgi_action.split("/");
splithtml2 = splithtml[splithtml.length - 1].split("#");;
if (splitcgi[splitcgi.length - 1] == splithtml2[0]) {
break;
}
}
for (var key in top.saved_cgi_params[i]) {
if (key == 'cgi_action' || key == 'source_html') continue;
document.writeln('<INPUT type="hidden">');
}
}
else if (!top.saved_params && top.saved_cgi_params[0]) {
for (i = 0; i < top.cgiArray; i++) {
if (!top.saved_cgi_params[i+1]) break;
}
for (var key in top.saved_cgi_params[i]) {
if (key == 'cgi_action' || key == 'source_html') continue;
document.writeln('<INPUT type="hidden">');
}
}
}
}
function doback() {
if (i >= 0 && i < top.cgiArray && top.saved_cgi_params[i]) {
var j;
for(j = 0;j <= document.F.length;j++) {
if (j == document.F.length) {
history.back();
return;
}
if (document.F.elements[j].type == 'hidden') {
break;
}
}
document.F.action=top.saved_cgi_params[i].cgi_action;
for (var key in top.saved_cgi_params[i]) {
if (key == 'cgi_action' || key == 'source_html') continue;
document.F.elements[j].name = key;
document.F.elements[j].value = top.saved_cgi_params[i][key];
j++;
}
document.F.submit();
}
else {
history.back();
}
}
//--></SCRIPT>
</HEAD>
<BODY bgcolor="#D1D8E8" link="blue" vlink="blue" alink="blue">
<P align="center">

wrHidden();

//--></SCRIPT>
</FORM>
</BODY>
