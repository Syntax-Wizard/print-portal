function lsttop(page){
var ltop = 1;
if(page != 1){
ltop = ((page-1) * pMax)+1;
}
return(ltop); 
}
function pagenum(lsttop){
var pagenum = 1;

pagenum = (lsttop +  pMax -1)/ pMax;
}
return(pagenum);
}
function lastpage(){
var pnum = lMax / pMax;
if(lMax % pMax != 0){

return pnum;

function wrRow() {
var lEnd;
var lStart = 1;
if(pNum != 1){
lStart = ((pNum-1) * pMax)+1;
}
lEnd = (lStart + pMax)-1;
if(lEnd > lMax){
lEnd = lMax;
}
for (var r=lStart,s=0; r<=lEnd; r++){
wrLstcl(r);
if(box.length > s  && box[s][0] == r){
wrBox(r,box[s][1],box[s][2],s);
s++;
}
else{
wrNobox(r);
}
wrLstcle();
}
}
