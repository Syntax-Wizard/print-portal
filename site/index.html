<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Portal</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --paper: #f3f4f2; --sheet: #fff; --ink: #1e2226; --ink-soft: #535b63; --rule: #dcdfdc;
    --accent: #0086c9; --accent-ink: #00669a; --accent-wash: #e3f2fa;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #171a1d; --sheet: #22262a; --ink: #e7e9eb; --ink-soft: #b2b9c0; --rule: #343a40; --accent: #3cb2ec; --accent-ink: #7ccbf2; --accent-wash: #16303d; }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); color: var(--ink); font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif; line-height: 1.7; }
  body { margin: 0; }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  h1 { margin: 0; font-size: 1.75rem; letter-spacing: -0.01em; }
  h2 { margin: 2.75rem 0 1rem; font-size: 1.15rem; }
  p { margin: 0 0 1rem; }
  .lead { margin-top: 1rem; font-size: 1.05rem; color: var(--ink-soft); }
  ol { margin: 0; padding-left: 1.4rem; }
  ol li { margin-bottom: 0.75rem; }
  .hint, .note { font-size: 0.9rem; color: var(--ink-soft); }
  .drag { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin: 1.25rem 0 0.5rem; padding: 1.5rem; border: 2px dashed var(--rule); border-radius: 14px; background: var(--sheet); }
  .bookmarklet { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.2rem; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; cursor: grab; }
  .bookmarklet:active { cursor: grabbing; }
  .swatch { display: inline-grid; grid-template-columns: repeat(2, 7px); gap: 2px; }
  .swatch i { width: 7px; height: 7px; border-radius: 1px; }
  dl { margin: 0; }
  dt { font-weight: 700; margin-top: 1.25rem; }
  dd { margin: 0.25rem 0 0; color: var(--ink-soft); }
  textarea { width: 100%; height: 5.5rem; margin-top: 0.75rem; padding: 0.6rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
  button { font: inherit; }
  .copy { margin-top: 0.5rem; padding: 0.35rem 0.9rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink); cursor: pointer; }
  select { font: inherit; padding: 0.25rem 0.5rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink); }
  footer { margin-top: 3rem; font-size: 0.8rem; color: var(--ink-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title"></h1>
    <select id="lang" aria-label="Language / 表示言語">
      <option value="ja" lang="ja">日本語</option>
      <option value="en" lang="en">English</option>
    </select>
  </header>
  <p class="lead" data-i18n="lead"></p>

  <h2 data-i18n="setupTitle"></h2>
  <p data-i18n="step1"></p>
  <div class="drag">
    <a class="bookmarklet" id="bookmarklet" href="__BOOKMARKLET__"><span class="swatch" aria-hidden="true"><i style="background:#00a0e9"></i><i style="background:#e4007f"></i><i style="background:#ffe100"></i><i style="background:#231815"></i></span><span data-i18n="button"></span></a>
    <span class="note" data-i18n="buttonNote"></span>
  </div>
  <p class="hint" data-i18n="step1Hint"></p>

  <h2 data-i18n="useTitle"></h2>
  <ol>
    <li data-i18n="use1"></li>
    <li data-i18n="use2"></li>
  </ol>

  <h2 data-i18n="faqTitle"></h2>
  <dl id="faq"></dl>
  <textarea id="code" readonly aria-label="Bookmarklet code">__BOOKMARKLET__</textarea>
  <button type="button" class="copy" id="copy" data-i18n="copy"></button>

  <footer id="version"></footer>
</main>
<script>
  // Install page i18n, same rules as the app: saved choice > browser language > Japanese.
  var I18N = __I18N__;
  var VERSION = "__VERSION__";
  var KEY = "printPortal.language";
  function pick() {
    try { var s = localStorage.getItem(KEY); if (I18N[s]) return s; } catch (e) {}
    var langs = navigator.languages || [navigator.language];
    for (var i = 0; i < langs.length; i++) { var b = String(langs[i]).toLowerCase().split("-")[0]; if (I18N[b]) return b; }
    return "ja";
  }
  function apply(lang) {
    var d = I18N[lang];
    document.documentElement.lang = lang;
    document.getElementById("lang").value = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = d[el.getAttribute("data-i18n")]; });
    var faq = document.getElementById("faq");
    faq.textContent = "";
    d.faq.forEach(function (qa) {
      var dt = document.createElement("dt"); dt.textContent = qa[0];
      var dd = document.createElement("dd"); dd.textContent = qa[1];
      faq.appendChild(dt); faq.appendChild(dd);
    });
    document.getElementById("version").textContent = d.version.replace("{{version}}", VERSION);
  }
  var current = pick();
  apply(current);
  document.getElementById("lang").addEventListener("change", function (e) {
    current = e.target.value;
    try { localStorage.setItem(KEY, current); } catch (err) {}
    apply(current);
  });
  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(document.getElementById("code").value).then(function () {
      btn.textContent = I18N[current].copied;
      setTimeout(function () { btn.textContent = I18N[current].copy; }, 2000);
    });
  });
</script>
</body>
</html>
