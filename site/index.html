<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tombo</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="__BRAND_FAVICON__">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f8fa;
    --surface-hover: #eef1f5;
    --ink: #14181f;
    --ink-soft: #4e5866;
    --ink-faint: #7e8794;
    --rule: #e5e8ee;
    --rule-strong: #cfd6e0;
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --accent-ink: #0369a1;
    --accent-wash: #e0f2fe;
    --on-accent: #ffffff;
    --menu-shadow: 0 10px 28px -6px rgb(15 23 42 / 0.16), 0 2px 6px -2px rgb(15 23 42 / 0.06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --surface: #171b22;
      --surface-hover: #212731;
      --ink: #f1f5f9;
      --ink-soft: #9aa5b5;
      --ink-faint: #6b7687;
      --rule: #262e3a;
      --rule-strong: #394353;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --accent-ink: #7dd3fc;
      --accent-wash: #0c2e45;
      --on-accent: #072030;
      --menu-shadow: 0 12px 32px -6px rgb(0 0 0 / 0.55);
    }
  }
  * { box-sizing: border-box; }
  html {
    background: var(--bg);
    color: var(--ink);
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, -apple-system, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { margin: 0; }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--rule);
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
  .mark { display: flex; width: 30px; height: 30px; flex-shrink: 0; }
  .mark svg { width: 100%; height: 100%; }
  h1 { margin: 0; font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }
  h2 { margin: 2.5rem 0 0.85rem; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0 0 1rem; }
  .lead { margin-top: 1.5rem; font-size: 1rem; color: var(--ink-soft); }
  ol { margin: 0; padding-left: 1.35rem; color: var(--ink-soft); }
  ol li { margin-bottom: 0.65rem; }
  .hint, .note { font-size: 0.875rem; color: var(--ink-soft); }

  /* Custom language popover menu */
  .lang-wrap { position: relative; }
  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    height: 2.125rem;
    padding: 0 0.65rem;
    border-radius: 0.625rem;
    border: 1px solid var(--rule);
    background: var(--bg);
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background-color 0.15s;
  }
  .lang-btn:hover,
  .lang-btn[aria-expanded="true"] {
    border-color: var(--rule-strong);
    color: var(--ink);
    background: var(--surface);
  }
  .lang-btn[aria-expanded="true"] { border-color: var(--accent); }
  .lang-btn .globe { width: 14px; height: 14px; color: var(--ink-faint); flex-shrink: 0; }
  .lang-btn .chev { width: 12px; height: 12px; color: var(--ink-faint); flex-shrink: 0; transition: transform 0.15s; }
  .lang-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .lang-code { text-transform: uppercase; letter-spacing: 0.04em; }

  .lang-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 20;
    min-width: 9rem;
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--rule);
    background: var(--bg);
    box-shadow: var(--menu-shadow);
  }
  .lang-menu[hidden] { display: none; }
  .lang-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.12s, color 0.12s;
  }
  .lang-option:hover { background: var(--surface-hover); }
  .lang-option[aria-checked="true"] {
    background: var(--accent-wash);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .lang-option .tag {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
  }
  .lang-option .check { width: 14px; height: 14px; flex-shrink: 0; }

  .drag {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem;
    margin: 1.15rem 0 0.75rem;
    padding: 1.5rem;
    border: 1.5px dashed var(--rule-strong);
    border-radius: 16px;
    background: var(--surface);
  }
  .bookmarklet {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 1.2rem;
    border-radius: 11px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 0.9375rem;
    font-weight: 700;
    text-decoration: none;
    cursor: grab;
    box-shadow: 0 2px 8px rgb(2 132 199 / 0.28);
    transition: background-color 0.15s, transform 0.12s;
  }
  .bookmarklet:hover { background: var(--accent-hover); }
  .bookmarklet:active { cursor: grabbing; transform: scale(0.98); }
  .btn-mark { display: inline-flex; width: 20px; height: 20px; }
  .btn-mark svg { width: 100%; height: 100%; }

  dl { margin: 0; }
  .faq-item { padding: 1rem 0; border-bottom: 1px solid var(--rule); }
  .faq-item:first-child { padding-top: 0.25rem; }
  .faq-item:last-child { border-bottom: 0; }
  dt { font-weight: 700; font-size: 0.9375rem; color: var(--ink); }
  dd { margin: 0.3rem 0 0; font-size: 0.9rem; color: var(--ink-soft); }

  textarea {
    width: 100%;
    height: 5.5rem;
    margin-top: 1rem;
    padding: 0.75rem;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink-soft);
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    resize: vertical;
  }
  button { font: inherit; }
  .copy {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    margin-top: 0.6rem;
    padding: 0.45rem 0.95rem;
    border: 1px solid var(--rule-strong);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .copy:hover { background: var(--surface); border-color: var(--accent); }
  .copy svg { width: 14px; height: 14px; color: var(--ink-soft); }

  footer {
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    font-size: 0.8rem;
    color: var(--ink-faint);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">__BRAND_SVG__</span>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="lang-wrap" id="lang-wrap">
      <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Language / 表示言語" title="Language / 表示言語">
        <svg class="globe" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="6" />
          <path d="M2.2 8h11.6M8 2a9.2 9.2 0 0 1 2.4 6A9.2 9.2 0 0 1 8 14a9.2 9.2 0 0 1-2.4-6A9.2 9.2 0 0 1 8 2Z" />
        </svg>
        <span class="lang-code" id="lang-code">JA</span>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 6.5 8 10l3.5-3.5" />
        </svg>
      </button>
      <div class="lang-menu" id="lang-menu" role="menu" hidden></div>
    </div>
  </header>
  <p class="lead" data-i18n="lead"></p>

  <h2 data-i18n="setupTitle"></h2>
  <p data-i18n="step1"></p>
  <div class="drag">
    <a class="bookmarklet" id="bookmarklet" href="__BOOKMARKLET__"><span class="btn-mark" aria-hidden="true">__BRAND_SVG__</span><span data-i18n="button"></span></a>
    <span class="note" data-i18n="buttonNote"></span>
  </div>
  <p class="hint" data-i18n="step1Hint"></p>

  <h2 data-i18n="useTitle"></h2>
  <ol>
    <li data-i18n="use1"></li>
    <li data-i18n="use2"></li>
  </ol>

  <h2 data-i18n="faqTitle"></h2>
  <dl id="faq"></dl>
  <textarea id="code" readonly aria-label="Bookmarklet code">__BOOKMARKLET__</textarea>
  <button type="button" class="copy" id="copy">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" />
      <path d="M10.5 5.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5" />
    </svg>
    <span id="copy-label" data-i18n="copy"></span>
  </button>

  <footer id="version"></footer>
</main>
<script>
  // Install page i18n, same rules as the app: saved choice > browser language > Japanese.
  var I18N = __I18N__;
  var VERSION = "__VERSION__";
  var KEY = "printPortal.language";
  var LANGS = [
    { code: "ja", label: "日本語" },
    { code: "en", label: "English" }
  ];
  function pick() {
    try { var s = localStorage.getItem(KEY); if (I18N[s]) return s; } catch (e) {}
    var langs = navigator.languages || [navigator.language];
    for (var i = 0; i < langs.length; i++) { var b = String(langs[i]).toLowerCase().split("-")[0]; if (I18N[b]) return b; }
    return "ja";
  }
  var langWrap = document.getElementById("lang-wrap");
  var langBtn = document.getElementById("lang-btn");
  var langMenu = document.getElementById("lang-menu");
  function setOpen(open) {
    langBtn.setAttribute("aria-expanded", String(open));
    langMenu.hidden = !open;
    // Keyboard: focus moves into the menu, on the current language.
    if (open) { var cur = langMenu.querySelector('[aria-checked="true"]'); if (cur) cur.focus(); }
  }
  langMenu.addEventListener("keydown", function (e) {
    var items = Array.prototype.slice.call(langMenu.querySelectorAll('[role="menuitemradio"]'));
    var at = items.indexOf(document.activeElement);
    var to = e.key === "ArrowDown" ? at + 1 : e.key === "ArrowUp" ? at - 1 : e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : null;
    if (e.key === "Tab") { setOpen(false); return; }
    if (to === null) return;
    e.preventDefault();
    items[(to + items.length) % items.length].focus();
  });
  function renderMenu(active) {
    langMenu.textContent = "";
    LANGS.forEach(function (l) {
      var isCurrent = l.code === active;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lang-option";
      btn.setAttribute("role", "menuitemradio");
      btn.setAttribute("aria-checked", String(isCurrent));
      btn.tabIndex = isCurrent ? 0 : -1;
      btn.lang = l.code;
      var label = document.createElement("span");
      label.textContent = l.label;
      btn.appendChild(label);
      if (isCurrent) {
        btn.insertAdjacentHTML("beforeend", '<svg class="check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" /></svg>');
      } else {
        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = l.code;
        btn.appendChild(tag);
      }
      btn.addEventListener("click", function () {
        current = l.code;
        try { localStorage.setItem(KEY, current); } catch (err) {}
        apply(current);
        setOpen(false);
        langBtn.focus();
      });
      langMenu.appendChild(btn);
    });
  }
  function apply(lang) {
    var d = I18N[lang];
    document.documentElement.lang = lang;
    document.getElementById("lang-code").textContent = lang.toUpperCase();
    renderMenu(lang);
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = d[el.getAttribute("data-i18n")]; });
    var faq = document.getElementById("faq");
    faq.textContent = "";
    d.faq.forEach(function (qa) {
      var item = document.createElement("div"); item.className = "faq-item";
      var dt = document.createElement("dt"); dt.textContent = qa[0];
      var dd = document.createElement("dd"); dd.textContent = qa[1];
      item.appendChild(dt); item.appendChild(dd);
      faq.appendChild(item);
    });
    document.getElementById("version").textContent = d.version.replace("{{version}}", VERSION);
  }
  var current = pick();
  apply(current);
  langBtn.addEventListener("click", function () {
    setOpen(langMenu.hidden);
  });
  document.addEventListener("pointerdown", function (e) {
    if (!langMenu.hidden && !langWrap.contains(e.target)) setOpen(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !langMenu.hidden) {
      setOpen(false);
      langBtn.focus();
    }
  });
  document.getElementById("copy").addEventListener("click", function () {
    var label = document.getElementById("copy-label");
    navigator.clipboard.writeText(document.getElementById("code").value).then(function () {
      label.textContent = I18N[current].copied;
      setTimeout(function () { label.textContent = I18N[current].copy; }, 2000);
    });
  });
</script>
</body>
</html>
